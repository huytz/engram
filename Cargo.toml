[package]
name = "engram"
version = "0.1.4"
edition = "2024"
rust-version = "1.85"
description = "One Claude Code memory for all your devices: encrypted sync of auto-memory and skills through R2/S3"
license = "MIT"
repository = "https://github.com/huytz/engram"
homepage = "https://github.com/huytz/engram"
readme = "README.md"
keywords = ["claude", "claude-code", "memory", "sync", "s3"]
categories = ["command-line-utilities", "development-tools"]
authors = ["huytz"]

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
sha2 = "0.11"
hex = "0.4"
age = { version = "0.12", default-features = false }
tokio = { version = "1", features = ["rt", "macros", "time"] }
futures-util = { version = "0.3", default-features = false, features = ["alloc"] }
aws-config = { version = "1", features = ["behavior-version-latest"] }
aws-sdk-s3 = "1"
aws-credential-types = "1"
aws-smithy-http-client = { version = "1", features = ["rustls-aws-lc"] }
rustls = { version = "0.23", default-features = false }
rustls-native-certs = "0.8"
rustls-pki-types = { version = "1", features = ["std"] }
base64 = "0.22"
walkdir = "2"
dirs = "7"
chrono = "0.4"

[profile.release]
opt-level = 2
lto = true
strip = true
